<!DOCTYPE html><html><head><meta charset="utf-8"><title>DOVA Loading…</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0;background:#0b0714;color:#5ff3e0;font-family:system-ui;display:grid;place-items:center;height:100vh}</style>
</head><body><p id="s">Awakening…</p>
<script>
(async()=>{
const s=document.getElementById('s');
try{
const n=3;
let b64='';
for(let i=0;i<n;i++){
  s.textContent='Loading '+(i+1)+'/'+n+'…';
  const r=await fetch('payload_'+i+'.txt');
  if(!r.ok) throw new Error('chunk '+i+' '+r.status);
  b64+=await r.text();
}
s.textContent='Decrypting the Reach…';
const bin=Uint8Array.from(atob(b64.trim()),c=>c.charCodeAt(0));
const ds=new DecompressionStream('gzip');
const stream=new Blob([bin]).stream().pipeThrough(ds);
const html=await new Response(stream).text();
document.open();document.write(html);document.close();
}catch(e){s.innerHTML='<pre style="color:#f88">Failed: '+e+'</pre>';console.error(e)}
})();
</script>
</body></html>
