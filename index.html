<!DOCTYPE html><html><head><meta charset="utf-8"><title>DOVA</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0;height:100%;background:#0b0714;color:#5ff3e0;font-family:system-ui}</style>
</head><body><p id="s" style="padding:2rem">Loading DOVA v0.2…</p>
<script>
(async()=>{
const s=document.getElementById('s');
try{
const n=21;
let html='';
for(let i=0;i<n;i++){
  s.textContent='Loading '+(i+1)+'/'+n+'…';
  const r=await fetch('hchunk_'+i+'.txt');
  if(!r.ok) throw new Error('chunk '+i+': '+r.status);
  html+=await r.text();
}
document.open();document.write(html);document.close();
}catch(e){s.textContent='Failed: '+e;console.error(e)}
})();
</script></body></html>
