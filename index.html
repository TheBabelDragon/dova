<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DOVA</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
html,body{margin:0;height:100%;background:#0b0714;color:#5ff3e0;font-family:system-ui,sans-serif;
  touch-action:none;-ms-touch-action:none;user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;overscroll-behavior:none;overflow:hidden}
#s{padding:2rem;max-width:36rem;line-height:1.55}
#s code{color:#ffc857;font-size:.9em}
.err{color:#f88}
</style>
</head>
<body>
<p id="s">Loading DOVA…</p>
<script>
(async () => {
  const el = document.getElementById('s');
  const show = (t) => { el.textContent = t; };
  const fail = (msg) => {
    el.innerHTML = '<strong class="err">DOVA failed to load</strong><br>' + msg +
      '<br><br>Expected fragments <code>s_0.txt</code>…<code>s_34.txt</code>.';
  };
  const base = (() => {
    try {
      const u = new URL('.', location.href);
      return u.href.endsWith('/') ? u.href : u.href + '/';
    } catch (_) { return ''; }
  })();
  try {
    const n = 35;
    show('Loading 0/' + n + '…');
    const parts = new Array(n);
    let done = 0;
    await Promise.all(Array.from({ length: n }, (_, i) =>
      fetch(base + 's_' + i + '.txt', { cache: 'no-cache' }).then(async (r) => {
        if (!r.ok) throw new Error('s_' + i + '.txt → HTTP ' + r.status);
        parts[i] = await r.text();
        done++; show('Loading ' + done + '/' + n + '…');
      })
    ));
    const html = parts.join('');
    if (html.length < 10000) throw new Error('Assembled payload too small (' + html.length + ')');
    if (!html.includes('function gH')) throw new Error('Payload missing gH — incomplete deploy');
    show('Starting…');
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    console.error(e);
    fail(String(e && e.message ? e.message : e));
  }
})();
</script>
</body>
</html>
